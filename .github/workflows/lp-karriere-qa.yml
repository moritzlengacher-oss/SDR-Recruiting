name: L&P Karriere – QA & Release Guard
on:
  push:
    branches:
      - main
      - feat/lp-karriere-separate-20261021
      - fix/lp-karriere-original-brand-20261027
      - fix/lp-karriere-audit-r05-20261027
    paths:
      - 'karriere/**'
      - '.github/workflows/lp-karriere-qa.yml'
  pull_request:
    paths:
      - 'karriere/**'
      - '.github/workflows/lp-karriere-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lp-career-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release-guard:
    name: Original L&P Branding · 21 Jobs · UI · API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: JavaScript syntax
        run: |
          node --check karriere/api/career-application.js
          node --check karriere/api/career-search.js
          node --check karriere/karriere/assets/app.js
          node --check karriere/karriere/assets/brand-shell.js
      - name: Build with verified original branding
        run: node karriere/build.mjs
      - name: Audit, brand parity and API regression suite
        run: node --test --test-isolation=none karriere/qa.test.mjs karriere/brand-guard.test.mjs karriere/metadata-regression.test.mjs karriere/application-validation.test.mjs karriere/search-integration.test.mjs tests/lp-karriere-release-guard.test.mjs

