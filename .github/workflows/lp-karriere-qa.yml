name: ASU L&P Karriere
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lp-career-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality-gate:
    name: ASU / lp-karriere / quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: karriere/package-lock.json
      - name: Install pinned browser and test dependencies
        working-directory: karriere
        run: npm ci --include=dev --ignore-scripts --no-audit --no-fund
      - name: Verify exact candidate, original brand and preserved behavior
        working-directory: karriere
        run: npm test
      - name: Preserve revision-bound results and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lp-karriere-qa-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: karriere/qa-output/
          if-no-files-found: error
          retention-days: 30
